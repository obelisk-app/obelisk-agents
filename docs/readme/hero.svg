imateMotion dur="3.2s" begin="1.8s" repeatCount="indefinite" path="M 930 230 L 810 350"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle><path id="l3" d="M 1130 360 L 930 230" stroke="#b4f953" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 7" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/></path><circle r="4" fill="#c5ff6e"><animateMotion dur="3.1s" begin="2.2s" repeatCount="indefinite" path="M 1130 360 L 930 230"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.1s" begin="2.2s" repeatCount="indefinite"/></circle><circle r="3" fill="#8fd3ff"><animateMotion dur="3.5s" begin="3.2s" repeatCount="indefinite" path="M 930 230 L 1130 360"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="3.2s" repeatCount="indefinite"/></circle>
