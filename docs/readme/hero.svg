  <linearGradient id="cardglow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4f953" stop-opacity="0.12"/><stop offset="0.6" stop-color="#b4f953" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
</defs>
