<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Obelisk Agents</title>
<desc id="d">A fleet of Nostr bots (price-bot, sat-ars-bot, Zap Bot, asados-bot) trading events with a NIP-29 relay.</desc>
