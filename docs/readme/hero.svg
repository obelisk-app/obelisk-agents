  <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c5ff6e" stop-opacity="0.55"/><stop offset="1" stop-color="#b4f953" stop-opacity="0"/></radialGradient>
